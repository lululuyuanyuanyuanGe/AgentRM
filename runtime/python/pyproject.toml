[project]
name = "agentrm-runtime"
version = "0.1.0"
description = "Python runtime client and static resource estimator for AgentRM"
requires-python = ">=3.9"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["agentrm_runtime*"]

